name: Build Check

# Compiles the project against Epic's prebuilt Unreal Engine container image,
# so CI never has to build the engine from source. Adjust branch names below
# to match your actual workflow.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-check:
    runs-on: ubuntu-latest

    # NOTE: even the "slim" dev image is tens of GB, so the first pull on a
    # fresh GitHub-hosted runner will take a few minutes no matter what —
    # that's still far faster than a from-source engine build.
    container:
      image: ghcr.io/epicgames/unreal-engine:dev-slim-5.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.UE_CICD_PAT }}
      # Epic's image runs as a non-root `ue4` user by default. That user
      # can't write to the runner's _temp/_runner_file_commands directory
      # that actions/checkout needs for its post-step bookkeeping, which
      # throws EACCES. Running the container as root fixes it.
      options: --user root

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Compile (Linux, Development — build only, no cook/package)
        run: |
          /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/Miner.uproject" \
            -noP4 -utf8output \
            -platform=Linux \
            -clientconfig=Development \
            -build
